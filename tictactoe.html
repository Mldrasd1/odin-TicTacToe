<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tictactoe</title>
    <link rel="stylesheet" href="tictactoe.css" />
  </head>
  <body style="display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin-top: 20px">hello players</h1>
    <div class="player-1">
      <label for="player-1">Player-1 Name</label>
      <input type="text" id="p1" />
    </div>
    <div class="player-2">
      <label for="player-2">Player-2 Name</label>
      <input type="text" id="p2" />
    </div>
    <button class="btn">Submit</button>
    <div class="divv">lets plays</div>
    <main
      style="
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 5px;
        width: 300px;
        height: 300px;
        margin: auto;
        margin-top: 50px;
      "
    >
      <div class="grid-item-1 item">X</div>
      <div class="grid-item-2 item">O</div>
      <div class="grid-item-3 item">X</div>
      <div class="grid-item-4 item">O</div>
      <div class="grid-item-5 item">X</div>
      <div class="grid-item-6 item">O</div>
      <div class="grid-item-7 item">X</div>
      <div class="grid-item-8 item">O</div>
      <div class="grid-item-9 item">X</div>
    </main>
    <script src="tictactoe.js"></script>
  </body>
</html>
